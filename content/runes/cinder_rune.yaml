id: solommo:cinder_rune
name: 煤のルーン
flavor: "いつも小さな火の粉がついてくる。"
effects:
  - trigger: on_hit
    actions:
      - type: spawn_projectiles
        count: 1
        damage_mult: 0.3
        target: nearest_enemy_in_radius
        radius: 6
        inherit_tags: [element:fire]
    flags:
      prevent_recursive: [spawn_projectiles]
      max_chain_depth: 3
