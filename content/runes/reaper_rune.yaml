id: solommo:reaper_rune
name: 刈り取りのルーン
flavor: "死は連鎖する。"
effects:
  - trigger: on_kill
    actions:
      - type: spawn_projectiles
        count: 2
        damage_mult: 0.4
        target: nearest_enemy_in_radius
        radius: 8
        inherit_tags: [element:fire]
    flags:
      prevent_recursive: [spawn_projectiles]
      max_chain_depth: 3
