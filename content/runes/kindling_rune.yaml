id: solommo:kindling_rune
name: 焚き付けのルーン
flavor: "燃え盛るものはさらに燃える。"
effects:
  - trigger: on_hit
    conditions:
      - type: target_has_status
        status: ignite
    actions:
      - type: spawn_projectiles
        count: 1
        damage_mult: 0.6
        target: nearest_enemy_in_radius
        radius: 6
        inherit_tags: [element:fire]
    flags:
      prevent_recursive: [spawn_projectiles]
      max_chain_depth: 3
