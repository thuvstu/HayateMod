id: solommo:hunter_rune
name: 狩人のルーン
flavor: "仕留めた獲物が最後の火花を散らす。"
effects:
  - trigger: on_kill
    actions:
      - type: spawn_projectiles
        count: 1
        damage_mult: 0.5
        target: nearest_enemy_in_radius
        radius: 8
        inherit_tags: [element:fire]
    flags:
      prevent_recursive: [spawn_projectiles]
      max_chain_depth: 3
