id: solommo:pyre_rune
name: 火葬のルーン
flavor: "燃える敵に火葬の火花を。"
effects:
  - trigger: on_hit
    conditions:
      - type: target_has_status
        status: ignite
    actions:
      - type: spawn_projectiles
        count: 2
        damage_mult: 0.3
        target: nearest_enemy_in_radius
        radius: 6
        inherit_tags: [element:fire]
    flags:
      prevent_recursive: [spawn_projectiles]
      max_chain_depth: 3
