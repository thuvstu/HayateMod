# ダメージ係数の上下限・既定値（暫定）
critical:
  base_chance: 0.05
  chance_cap: 0.60
  base_multiplier: 1.5
  multiplier_cap: 2.5
# スキル核の基礎値（暫定・実プレイとシミュレーターで更新）
# item_level 曲線・レベル曲線は未導入のため、エンジンは暫定式
# item_curve = 1 + 0.05 * item_level を使用（ADR-08 参照）
core_base:
  melee_thrust: 6.0
  projectile_single: 5.0
  heavy_slam: 12.0
  summon_minions: 0.0
  dash: 0.0
# プレイヤーの英雄補正（暫定・Phase 6のレベル制で置換）
# 「初めからインフレ」方針：プレイヤーの与ダメージと基準HPを高めに置く。
heroic_player_mult: 10.0
heroic_reference_level: 10
# 野生バニラMobの底上げ（Phase 6以降のフィールド調整。暫定値）
wild:
  damage_mult: 1.5
  hp_mult: 2.0
caps:
  target_resistance_max: 0.75
  armor_mitigation_max: 0.80
  guard_reduction_max: 0.90
# 内部は float、表示は floor（二重丸め禁止）
rounding: display_floor
# ランク別目標戦闘時間（秒）と被ダメ割合：敵HP/実効DPSの導出に使用
rank_targets:
  trash:   { fight_seconds: 14,  damage_taken_ratio: 0.15 }
  elite:   { fight_seconds: 45,  damage_taken_ratio: 0.35 }
  named:   { fight_seconds: 90,  damage_taken_ratio: 0.50 }
  boss:    { fight_seconds: 720, damage_taken_ratio: 0.90 }
