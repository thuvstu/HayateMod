id: solommo:cinder_pike
name: 煤の長槍
family: spear
rarity: rare
item_level: 8
tags_extra: [content:field_clear]
role_hint: [tank]
skills:
  primary:
    core: melee_thrust
    mods: {element: fire, range: 4, width: 0.35}
    effects:
      - trigger: on_damaged
        actions:
          - type: leap
            distance: 5
        flags:
          prevent_recursive: []
          max_chain_depth: 3
  special:
    core: projectile_single
    mods: {element: fire, range: 20, cooldown: 3}
    effects:
      - trigger: on_hit
        actions:
          - type: missile
            count: 2
            damage_mult: 0.6
            radius: 12
            distance: 1.6
            amount: 100
            inherit_tags: [element:fire]
        flags:
          prevent_recursive: [spawn_projectiles]
          max_chain_depth: 3
design_note: "素直な基本槍。"
