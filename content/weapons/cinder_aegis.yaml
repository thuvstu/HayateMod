id: solommo:cinder_aegis
name: 灰守の誓剣
family: sword
rarity: unique
item_level: 20
tags_extra: [content:boss_hunt]
role_hint: [tank]
skills:
  primary:
    core: melee_thrust
    mods: {element: fire, range: 3, width: 0.5}
    effects:
      - trigger: on_hit
        conditions:
          - type: self_has_shield
        actions:
          - type: strike
            damage_mult: 0.35
        flags: {prevent_recursive: [], max_chain_depth: 1}
  special:
    core: self_buff
    mods: {cooldown: 10, resource: stamina, resource_cost: 20}
    effects:
      - trigger: on_cast
        actions:
          - type: grant_shield
            amount: 90
            duration_ticks: 100
        flags: {prevent_recursive: [], max_chain_depth: 0}
  heavy:
    core: self_buff
    mods: {cooldown: 18, resource: mana, resource_cost: 25}
    effects:
      - trigger: on_cast
        actions:
          - type: heal_with_shield
            amount: 100
            shield_ratio: 0.6
            duration_ticks: 120
        flags: {prevent_recursive: [], max_chain_depth: 0}
design_note: "被弾前にGで守りを張り、耐久が残る間に追撃。Shift＋右クリックは40HP回復と耐久60のシールドに分配。重ね掛けで耐久は加算されない。"
