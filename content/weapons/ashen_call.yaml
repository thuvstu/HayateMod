id: solommo:ashen_call
name: 灰呼びの杖
family: staff
rarity: unique
item_level: 15
tags_extra: [content:field_clear]
role_hint: [dps]

skills:
  primary:
    core: melee_thrust
    mods:
      element: fire
      range: 2
      width: 1.2
    effects:
      - trigger: on_hit
        conditions:
          - type: day
        actions:
          - type: strike
            damage_mult: 0.5
        flags:
          prevent_recursive: []
          max_chain_depth: 3
      - trigger: on_join
        actions:
          - type: extinguish
          - type: cleanse
          - type: message
            ref: 灰が身を清める
        flags:
          prevent_recursive: []
          max_chain_depth: 3

  special:
    core: projectile_single
    mods:
      element: fire
      range: 28
      cooldown: 5
    effects:
      - trigger: on_death
        actions:
          - type: spawn_projectiles
            count: 6
            damage_mult: 0.5
            radius: 10
            inherit_tags: [element:fire]
        flags:
          prevent_recursive: [spawn_projectiles]
          max_chain_depth: 3
      - trigger: on_hit
        actions:
          - type: lightning
            damage_mult: 1.0
          - type: repeat
            count: 3
            amount: 20
        flags:
          prevent_recursive: []
          max_chain_depth: 3

design_note: "灰枝槍と対になる検証用2本目。分裂なし・遅い・遠い素直な火弾で、複数武器の動作を証明する。"
