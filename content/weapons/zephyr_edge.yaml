id: solommo:zephyr_edge
name: 残影の小太刀
family: sword
rarity: unique
item_level: 16
tags_extra: [content:field_clear]
role_hint: [dps]
skills:
  primary:
    core: melee_thrust
    mods: {element: fire, range: 3, width: 0.5}
    effects:
      - trigger: on_hit
        actions:
          - type: addvar
            ref: skirmish
            amount: 1
        flags:
          prevent_recursive: []
          max_chain_depth: 3
      - trigger: on_damaged
        actions:
          - type: spawn_projectiles
            count: 2
            damage_mult: 0.3
            target: attacker
            radius: 6
            inherit_tags: [element:fire]
        flags:
          prevent_recursive: [spawn_projectiles]
          max_chain_depth: 3
      - trigger: on_kill
        actions:
          - type: heal_self
            formula: 10+mana*0.2
          - type: setvar
            ref: skirmish
            amount: 0
        flags:
          prevent_recursive: []
          max_chain_depth: 3
  special:
    core: dash
    mods: {distance: 8, cooldown: 6}
  heavy:
    core: melee_thrust
    mods: {element: fire, range: 3, width: 0.5, cooldown: 8}
    effects:
      - trigger: on_hit
        conditions:
          - type: variable
            name: skirmish
            value: 3
        actions:
          - type: blink
          - type: sound
            effect: entity_enderman_teleport
        flags:
          prevent_recursive: []
          max_chain_depth: 3
design_note: "被弾の棘・疾走・吸収。当てて離れるスカーミッシャー。"
