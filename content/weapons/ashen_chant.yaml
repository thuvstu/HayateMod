id: solommo:ashen_chant
name: 灰詠みの杖
family: staff
rarity: unique
item_level: 18
tags_extra: [content:field_clear]
role_hint: [dps]
skills:
  primary:
    core: melee_thrust
    mods: {element: fire, range: 2, width: 1.2}
    effects:
      - trigger: on_kill
        actions:
          - type: reduce_next_cast
            ref: special
            amount: 1
            duration_ticks: 200
        flags: {prevent_recursive: [], max_chain_depth: 0}
  special:
    core: projectile_single
    mods: {element: fire, range: 30, cooldown: 5, cast_time: 1.5, resource: mana, resource_cost: 20}
    effects:
      - trigger: on_hit
        actions:
          - type: strike
            damage_mult: 1
        flags: {prevent_recursive: [], max_chain_depth: 1}
  heavy:
    core: self_buff
    mods: {cooldown: 12, cast_time: 0.5, resource: mana, resource_cost: 15}
    effects:
      - trigger: on_cast
        actions:
          - type: heal_self
            amount: 25
        flags: {prevent_recursive: [], max_chain_depth: 0}
design_note: "撃破後10秒以内の次のGは詠唱1.5秒から0.5秒へ。短縮は1回分で加算されず、残りCDは変わらない。中断時に費用・CD・消費した短縮は戻らない。"
