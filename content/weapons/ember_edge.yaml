id: solommo:ember_edge
name: 残り火の刃
family: sword
rarity: rare
item_level: 10
tags_extra: [content:field_clear]
role_hint: [dps]
skills:
  primary:
    core: melee_thrust
    mods: {element: fire, range: 3, width: 0.5}
    effects:
      - trigger: on_hit
        actions:
          - type: spawn_projectiles
            count: 1
            damage_mult: 0.25
            target: nearest_enemy_in_radius
            radius: 5
            inherit_tags: [element:fire]
          - type: ignite
            amount: 5
        flags:
          prevent_recursive: [spawn_projectiles]
          max_chain_depth: 3
  special:
    core: projectile_single
    mods: {element: fire, range: 22, cooldown: 4}
    effects:
      - trigger: on_hit
        actions:
          - type: strike
            damage_mult: 0.3
          - type: cast
            ref: heavy
        flags:
          prevent_recursive: []
          max_chain_depth: 3
  heavy:
    core: melee_thrust
    mods: {element: fire, range: 3, width: 0.5, cooldown: 10}
    effects:
      - trigger: on_hit
        scope: area
        radius: 4
        actions:
          - type: knockback
            damage_mult: 1.5
          - type: delay
            amount: 10
          - type: explosion
            damage_mult: 2.0
        flags:
          prevent_recursive: []
          max_chain_depth: 3
design_note: "小さく弾ける基本剣。"
