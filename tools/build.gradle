// tools: CLI entry points (validate / report / drop solver) over core.

plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':core')
}

def contentDir = rootProject.file("content").absolutePath

tasks.register("validateContent", JavaExec) {
    group = "solommo"
    description = "Load + validate the Content Pack (exit 1 on ERROR)."
    workingDir = rootProject.projectDir
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "com.thuvstu.hayatemod.tools.ValidateMain"
    args = [contentDir]
}

tasks.register("contentReport", JavaExec) {
    group = "solommo"
    description = "Reference index, unused vocabulary, weapon tooltips."
    workingDir = rootProject.projectDir
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "com.thuvstu.hayatemod.tools.ReportMain"
    args = [contentDir]
}

tasks.register("dropSolve", JavaExec) {
    group = "solommo"
    description = "Drop-rate solver. Pass -PcliArgs=\"<E> <G>\"."
    workingDir = rootProject.projectDir
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "com.thuvstu.hayatemod.tools.DropSolveMain"
    def extra = findProperty("cliArgs")?.toString()?.split("\\s+")?.toList() ?: []
    args = extra
}

tasks.register("marketSim", JavaExec) {
    group = "solommo"
    description = "NPC-market projection. Pass -PcliArgs=\"[days] [dumpDay dumpItem dumpCount]\"."
    workingDir = rootProject.projectDir
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "com.thuvstu.hayatemod.tools.MarketSimMain"
    def extra = findProperty("cliArgs")?.toString()?.split("\\s+")?.toList() ?: []
    args = [contentDir] + extra
}

tasks.register("collectionSim", JavaExec) {
    group = "solommo"
    description = "Seeded loot/exchange/craft collection timing; -PcliArgs='enemy ruleset minutes item,item [seed trials maxRuns]'."
    workingDir = rootProject.projectDir
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "com.thuvstu.hayatemod.tools.CollectionSimMain"
    def extra = findProperty("cliArgs")?.toString()?.split("\\s+")?.toList() ?: []
    args = [contentDir] + extra
}

tasks.register("effectFuzz", JavaExec) {
    group = "solommo"
    description = "Seeded core effect stress distributions; -PcliArgs='seed samples ticks'."
    workingDir = rootProject.projectDir
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "com.thuvstu.hayatemod.tools.EffectFuzzMain"
    def extra = findProperty("cliArgs")?.toString()?.split("\\s+")?.toList() ?: []
    args = [contentDir] + extra
}
