name: build

# Builds the mod on every push / PR and publishes a GitHub release for `v*` tags.
#
# The listing of the produced jar is written to the job summary so it can be
# inspected straight from the Actions UI (or the check runs API).
on:
  push:
    # `branches` is required as well: a workflow that only filters on `tags`
    # does not run for branch pushes at all.
    branches:
      - '**'
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: gradle

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: |
          set -o pipefail
          mkdir -p build/ci
          ./gradlew build --stacktrace 2>&1 | tee build/ci/build-log.txt

      - name: inspect the jar
        if: always()
        run: |
          set +e
          {
            echo '## Jar contents'
            echo
            echo '```'
            ls -la build/libs/
            for jar in build/libs/*.jar; do
              echo "--- $jar ---"
              unzip -l "$jar"
              if unzip -l "$jar" | grep -q "fabric.mod.json"; then
                echo "--- fabric.mod.json ---"
                unzip -p "$jar" fabric.mod.json
              fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Announcements land in the check run annotations, which makes the same
          # information readable through the API (handy for automation).
          modjar=$(ls build/libs/hayatemod-*.jar | grep -v sources | head -n 1)
          echo "::notice title=jar-file::$(basename "$modjar") size=$(stat -c%s "$modjar")"
          echo "::notice title=jar-entries::$(unzip -Z1 "$modjar" | wc -l) entries"
          echo "::notice title=jar-listing::$(unzip -Z1 "$modjar" | tr '\n' ' ')"
          echo "::notice title=fabric.mod.json::$(unzip -p "$modjar" fabric.mod.json | tr -d '\n' | tr -s ' ')"

      - name: report failure tail
        if: failure()
        run: |
          set +e
          {
            echo '## Build log (tail)'
            echo
            echo '```'
            tail -n 120 build/ci/build-log.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Also publish the compiler output as error annotations: at most 10 per
          # step, ~4k characters each, which is enough for a javac error list.
          python3 - <<'PY'
          import pathlib, re
          log = pathlib.Path('build/ci/build-log.txt')
          text = log.read_text(errors='replace') if log.exists() else ''
          lines = [line for line in text.splitlines()
                   if re.search(r'error:|warning:|FAILED|\* What went wrong|\* Try:|Could not resolve|Execution failed', line)]
          if not lines:
              lines = text.splitlines()[-60:]
          chunk, chunks = [], []
          for line in lines:
              chunk.append(line)
              if sum(len(c) + 1 for c in chunk) > 3500:
                  chunks.append(chunk); chunk = []
          if chunk:
              chunks.append(chunk)
          for index, group in enumerate(chunks[:10]):
              message = '\n'.join(group).replace('%', '%25').replace('\r', '%0D')[:4000].replace('\n', '%0A')
              print(f"::error title=build-log[{index + 1}]::{message}")
          PY

      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hayatemod-jar
          path: build/libs/
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: gradle

      - name: build
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: publish release with the mod jar
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
